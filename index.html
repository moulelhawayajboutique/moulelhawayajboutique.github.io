<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مول لحوايج · Moul Lhwayej</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--ink2:#17130d;--blue:#3b82f6;--gold:#e8c76a;--sand:#f5efe0;--rose:#c8102e;--line:rgba(201,162,75,.3)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--sand);font:16px/1.55 Cairo,system-ui,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top)}
h1,h2,.logo{font-family:"Playfair Display",Cairo,serif}
h3{font-family:Cairo,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px clamp(14px,4vw,40px);background:rgba(13,16,48,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{font-size:1.25rem;font-weight:800;margin-inline-end:auto}
.pill{background:rgba(244,234,215,.08);border:1px solid var(--line);border-radius:99px;padding:7px 14px;transition:.2s}
.pill:hover{background:var(--gold);color:var(--ink)}
.cta{background:var(--gold);color:var(--ink);font-weight:800;border-radius:12px;padding:12px 22px}
.cta:hover{background:var(--sand)}
.hero{min-height:88vh;display:grid;align-content:center;padding:0 clamp(18px,6vw,80px);max-width:900px}
.hero h1{font-size:clamp(2.6rem,9vw,6.4rem);line-height:.95;font-weight:800}
.hero p{max-width:34ch;margin:22px 0 28px;color:rgba(244,234,215,.78);font-size:1.15rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;padding:16px clamp(14px,4vw,40px);background:rgba(13,16,48,.8);backdrop-filter:blur(12px)}
.bar input,.bar select,.f input,.f select,.f textarea{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.bar input{flex:1 1 200px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;padding:18px clamp(14px,4vw,40px) 60px;perspective:1000px}
.card{background:linear-gradient(160deg,var(--ink2),rgba(23,26,69,.4));border:1px solid var(--line);border-radius:22px;overflow:hidden;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .15s,border-color .2s;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold)}
.ph{aspect-ratio:1;display:grid;place-items:center;font-size:4rem;background:radial-gradient(circle at 30% 20%,var(--blue),var(--ink2));background-size:cover;background-position:center}
.cb{padding:14px;display:grid;gap:6px;flex:1}
.cb h3{font-size:1.02rem}
.price{color:var(--gold);font-weight:800;font-size:1.15rem}
.low{color:var(--rose);font-size:.82rem}
.card .cta{margin:0 14px 14px;padding:10px}
.card .cta:disabled{opacity:.4;cursor:not-allowed}
aside{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--ink2);border-inline-start:1px solid var(--line);z-index:40;padding:20px;display:none;flex-direction:column;gap:12px;overflow:auto}
aside.on{display:flex}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
.x{background:none;font-size:1.4rem;margin-inline-start:auto}
.f{display:grid;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
td button{background:rgba(244,234,215,.1);border-radius:8px;padding:4px 8px;margin:1px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats div{background:var(--ink);border-radius:12px;padding:8px 12px;flex:1}
.stats b{display:block;font-size:1.3rem;color:var(--gold)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 20px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:60}
#toast.on{opacity:1}
html{scroll-padding-top:80px}
.fl{background:none;padding:2px;border-radius:6px;opacity:.55;line-height:0}.fl.on,.fl:hover{opacity:1;outline:2px solid var(--gold)}
#chips{display:flex;gap:6px;flex-wrap:wrap}#chips button{background:rgba(244,234,215,.08);border:1px solid var(--line);border-radius:99px;padding:8px 14px}#chips button.on{background:var(--gold);color:var(--ink)}
.old{opacity:.55;font-weight:400;font-size:.85rem}.bd{background:var(--rose);color:#fff;border-radius:6px;padding:0 6px;font-style:normal;font-size:.8rem}
.sec{padding:40px clamp(14px,4vw,40px);max-width:1200px;margin:auto}.sec h2{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:zoom-in}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.vd iframe,.vd video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}.rv{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px}.star{color:var(--gold)}
.lk{display:flex;gap:8px;align-items:center;background:var(--ink2);padding:14px;border-radius:14px;color:var(--sand)}.lk img{width:22px}
#map{width:100%;height:300px;border:0;border-radius:18px}.acts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.acts a{text-decoration:none}
.note{color:var(--gold);font-size:.9rem}
footer{display:grid;justify-items:center;gap:12px;padding:30px 14px calc(110px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.soc{display:flex;gap:12px}.soc a{width:46px;height:46px;border-radius:50%;background:var(--sand);display:grid;place-items:center}.soc img{width:24px;height:24px}
.fab{position:fixed;z-index:30;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:0;font-size:1.5rem;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4);inset-inline-end:16px}
.fab.wa{bottom:calc(16px + env(safe-area-inset-bottom));background:#25d366;animation:pulse 2s infinite}.fab.wa img{width:30px}
.fab.cl{bottom:calc(84px + env(safe-area-inset-bottom));background:var(--blue);color:#fff}
.fab.ai{bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-end:auto;inset-inline-start:16px;background:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
#chat{position:fixed;z-index:50;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline-start:16px;width:min(360px,calc(100% - 32px));height:min(460px,60vh);background:var(--ink2);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
#chat[hidden]{display:none}
.ch{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
#cm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{background:var(--ink);padding:8px 12px;border-radius:14px;max-width:85%;white-space:pre-line}.m.me{background:var(--blue);align-self:flex-end}
#cfm{display:flex;gap:6px;padding:8px}#cfm input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}#cfm .cta{padding:8px 14px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:70;display:grid;place-items:center}#lb img{max-width:92%;max-height:90%;border-radius:12px}
header{gap:10px}
.logo{margin-inline-end:0}
#bMenu{display:none;font-size:1.2rem;line-height:1;min-width:44px}
nav{display:flex;align-items:center;gap:2px;margin-inline:auto}
nav a{white-space:nowrap;color:var(--sand);text-decoration:none;padding:6px 10px;border-radius:99px;font-size:.88rem}
nav a:hover{background:var(--gold);color:var(--ink)}
.flags{display:flex;gap:6px}nav .flags,nav .mo{display:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:18;display:none}#scrim.on{display:block}
body.mo .fab,body.mo #chat{display:none}
#grid,.bar{max-width:1400px;margin-inline:auto}
#panel{overflow-x:auto}
.hero h1,.hero p{text-shadow:0 2px 18px rgba(13,16,48,.8)}
@media(max-width:1399px){
 header{backdrop-filter:none;background:var(--ink)}
 #bMenu{display:block}
 header>.flags,#bAdmin{display:none}
 .logo{margin-inline-end:auto}
 nav{position:fixed;z-index:25;top:0;bottom:0;inset-inline-start:0;width:min(320px,86%);margin:0;flex-direction:column;align-items:stretch;gap:4px;background:var(--ink2);border-inline-end:1px solid var(--line);padding:76px 18px 24px;overflow:auto;transform:translateX(-105%);transition:transform .25s}
 [dir=rtl] nav{transform:translateX(105%)}
 nav:not(.open){visibility:hidden;transition:transform .25s,visibility 0s .25s}
 nav.open{transform:none!important}
 nav a{font-size:1.1rem;padding:12px 14px;border-radius:12px}
 nav .flags,nav .mo{display:flex}
 nav .flags{padding:14px;gap:10px}
 nav .mo{color:var(--ink)!important;background:var(--gold);justify-content:center;font-weight:800;margin-top:8px}
}
@media(max-width:520px){.hero{min-height:80vh}.bar{flex-direction:column}.bar input{flex:none}#grid{grid-template-columns:repeat(2,1fr);gap:12px}.cb{padding:10px}.card .cta{margin:0 10px 10px}.fab{width:52px;height:52px}}

.fr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;width:100%}

#chips button{background:#17130c;border-color:#4d3d1c;color:var(--sand)}#chips button.on{background:var(--gg);color:#1a1205;border-color:transparent;font-weight:800}
#grid{perspective:none;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{transform:none;background:linear-gradient(180deg,#1c170f,#100d08);border:1px solid rgba(201,162,75,.4);border-radius:26px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--gold);box-shadow:0 10px 30px rgba(201,162,75,.12)}

.ph::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,#1c170f);pointer-events:none}
.hb{position:absolute;z-index:2;left:12px;top:12px;width:44px;height:44px;border-radius:50%;background:rgba(45,45,45,.78);color:#fff;display:grid;place-items:center}
.hb.on svg{fill:#ff4d6d;stroke:#ff4d6d}

.cb{padding:6px 16px 12px;gap:8px}

.pr{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price,.old{direction:ltr;unicode-bidi:isolate}

.old{color:var(--mut);font-size:1rem;font-weight:400;opacity:1}
.sw{display:flex;gap:10px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.28);padding:0}

.fab{right:16px;left:auto}

.fab.ai i{width:12px;height:12px;border-radius:50%;background:#22c55e}

#ppv{max-width:130px;border-radius:12px}
.gal video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#000}

/* ===== Tema claro: blanco, azul y texto negro ===== */
:root{color-scheme:light;--ink:#fff;--ink2:#f1f5fd;--sand:#0b0b0b;--gold:#1d4ed8;--rose:#c8102e;--line:rgba(29,78,216,.28);--gg:linear-gradient(135deg,#8ec0ff,#3b82f6 55%,#6aa8ff);--gt:linear-gradient(135deg,#1e3a8a,#2563eb);--mut:#4b5a78}

async function load(){

async function saveP(p){
  const{id,...d}=p;

}
async function delP(id){

const persist=()=>{localStorage.cart=JSON.stringify(cart);renderCart()};
function renderCart(){
  cart=cart.filter(l=>products.some(p=>p.id==l.id));
  $("#cnt").textContent=cart.reduce((a,l)=>a+l.n,0)||"";
  let tot=0;
  $("#lines").innerHTML=cart.length?cart.map((l,i)=>{const p=products.find(x=>x.id==l.id),c=l.c?cp(l.c):null;tot+=p.price*l.n;return`<div class="row"><span>${esc(pn(p))}${c?` <i class="dot sm" style="background:${esc(c.h)}"></i> <small>${esc(cnm(c.n))}</small>`:""}</span><span><button class="pill" data-m="${i}">−</button> ${l.n} <button class="pill" data-p="${i}">+</button></span><b>${money(p.price*l.n)}</b></div>`}).join(""):`<p>${t("empty")}</p>`;

}
$("#lines").onclick=e=>{const m=e.target.dataset.m,pl=e.target.dataset.p,i=m!==undefined?m:pl;if(i===undefined)return;const l=cart[+i],pr=products.find(x=>x.id==l.id);if(m!==undefined)l.n--;else if(cart.filter(x=>x.id==l.id).reduce((a,x)=>a+x.n,0)<pr.stock)l.n++;cart=cart.filter(x=>x.n>0);persist()};

async function cl(n){if(db){try{const q=await db.ref(n).get(),v=q.val()||{};return Object.entries(v).map(([id,d])=>({id,...d})).sort((a,b)=>(b.created||0)-(a.created||0))}catch(e){return[]}}return JSON.parse(localStorage["c_"+n]||"null")||SEED[n]||[]}
async function ca(n,o){o.created=Date.now();if(db){try{await db.ref(n).push().set(o)}catch(e){toast(t("eSave"));throw e}}else{const a=await cl(n);o.id="x"+Date.now();a.unshift(o);lsSet("c_"+n,JSON.stringify(a))}}
async function cd(n,id){if(db)await db.ref(n+"/"+id).remove();else lsSet("c_"+n,JSON.stringify((await cl(n)).filter(x=>x.id!=id)))}
let C={},mode="";
async function loadC(){for(const n of["reviews","winners","videos","gallery","collections"])C[n]=await cl(n);renderC();menuCols();if(isAdmin)fillCols();if(isAdmin)adminC()}
function lsSet(k,v){try{localStorage[k]=v}catch(e){toast(t("mem"))}}
async function shrink(file,max=1200,q=.82){const bm=await createImageBitmap(file),k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",q))}
async function up(file,dir){
  const isV=file.type.startsWith("video/");let blob=file;
  if(!isV){try{blob=await(storage?shrink(file):shrink(file,900,.72))||file}catch(e){}}
  if(storage){const ext=isV?(file.name.split(".").pop()||"mp4"):"jpg",r=storage.ref(`${dir}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`);try{await r.put(blob,{contentType:blob.type||file.type});return await r.getDownloadURL()}catch(e){console.warn("Storage no disponible",e);if(isV)throw e;try{blob=await shrink(file,900,.72)||file}catch(x){}}}
  if(isV&&file.size>3e6)throw new Error("video grande");
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
}
const busy=o=>{document.querySelectorAll("#admin .cta").forEach(b=>b.disabled=!!o);$("#upst").textContent=o?"⏳ "+t("upl"):""};
const setCfl=()=>{const n=$("#cfile").files.length;$("#cfl").textContent=n?"✅ "+n+" "+t("nf"):"📷🎥 "+t("upMedia")};
function vid(u){const m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);if(m)return`<iframe loading="lazy" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen title="video"></iframe>`;if(/\.(mp4|webm|mov)|^data:video/i.test(u))return`<video src="${esc(u)}" controls playsinline preload="metadata"></video>`;return`<a class="lk" href="${esc(u)}" target="_blank" rel="noopener">${lg("tiktok","#000",22)}${esc(u.slice(0,40))}</a>`}
function renderC(){
  document.querySelectorAll(".fl").forEach(b=>b.classList.toggle("on",b.dataset.l==lang));
  const r=C.reviews||[];$("#avg").textContent=r.length?(r.reduce((a,x)=>a+x.stars,0)/r.length).toFixed(1)+" ★ ("+r.length+")":"";
  $("#rvl").innerHTML=r.map(x=>`<div class="rv"><b>${esc(x.name)}</b> <span class="star">${"★".repeat(x.stars)}${"☆".repeat(5-x.stars)}</span><p>${esc(x.text)}</p></div>`).join("");
  $("#wl").innerHTML=(C.winners||[]).map(w=>`<div class="rv">🎟️ <b>${esc(w.name)}</b><p>${esc(w.prize)}</p><small>${esc(w.ticket||"")}</small></div>`).join("")||`<p>${t("nowin")}</p>`;
  $("#vl").innerHTML=(C.videos||[]).map(v=>`<figure class="vd">${vid(v.url)}<figcaption>${esc(v.title)}</figcaption></figure>`).join("")||`<p>${t("novid")}</p>`;
  $("#gl").innerHTML=(C.gallery||[]).map(g=>g.kind=="video"?`<video src="${esc(g.url)}" controls playsinline preload="metadata"></video>`:`<img loading="lazy" src="${esc(g.url)}" alt="${esc(g.title)}" data-lb>`).join("")||`<p>${t("novid")}</p>`;
  const A=encodeURIComponent(CFG.address);
  $("#fwa").href=`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(t("hi"))}`;$("#fph").href="tel:"+CFG.phone;$("#floc").href=CFG.maps;
  $("#dir").href=`https://www.google.com/maps/dir/?api=1&destination=${A}`;
  if(!$("#map").src)$("#map").src=`https://www.google.com/maps?q=${A}&output=embed`;
}
async function adminC(){
  const m=await cl("messages"),o=await cl("orders");
  $("#inbox").innerHTML=`<h3>✉️ ${m.length}</h3>`+m.slice(0,10).map(x=>`<div class="row"><span>${esc(x.name)} · ${esc(x.phone||x.email)} · ${esc(x.msg)}</span><button class="pill" data-cd="messages|${x.id}">✕</button></div>`).join("")+`<h3>📦 ${o.length}</h3>`+o.slice(0,10).map(x=>`<div class="row"><span>${esc(x.name)} · ${esc(x.phone)} · ${esc(x.address)} · ${esc(x.total)}</span><button class="pill" data-cd="orders|${x.id}">✕</button></div>`).join("");

}

/* ---- Asistente IA flotante ---- */
const nz=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const K={hours:/horari|hora|heure|hours|open|abiert|ouvert|orari|aperto|وقت|ساعات/,loc:/ubica|direc|donde|gps|where|address|adress|dove|indiriz|موقع|عنوان|فين/,pay:/pag|reembols|cash|contre|paiement|payment|pagament|دفع|الاستلام/,ret:/devol|return|retour|reso|rimbors|ارجاع|إرجاع/,ship:/envio|entrega|ship|deliver|livraison|spedi|consegna|توصيل|شحن/,offer:/ofert|liquid|sale|promo|solde|descuento|discount|sconto|عرض|تخفيض|تصفية/,tomb:/tombola|ganador|winner|gagnant|vincitor|قرعة|فائز/,contact:/contact|telef|phone|whats|llam|call|appel|chiam|اتصال|هاتف/};
const KT={hours:"a_hours",loc:"a_loc",pay:"cod",ret:"retT",ship:"a_ship",offer:"a_offer",tomb:"a_tomb",contact:"a_contact"};
async function bot(q){
  if(CFG.aiEndpoint){try{const r=await fetch(CFG.aiEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q,lang})});const j=await r.json();if(j.answer)return j.answer}catch(e){}}
  const s=nz(q);
  for(const k in K)if(K[k].test(s))return t(KT[k]).replace("{h}",CFG.hours);
  const tk=s.split(/[^a-z0-9]+/).filter(w=>w.length>2),hit=products.filter(p=>tk.some(w=>nz(p.name+" "+p.cat).includes(w))).slice(0,3);
  if(hit.length)return t("a_prod")+"\n"+hit.map(p=>`• ${p.name} — ${money(p.price)} (${p.stock>0?t("left")+" "+p.stock:t("sold")})`).join("\n");
  return /\b(hola|salut|bonjour|hello|hi|ciao|salam)\b|سلام|مرحب/.test(s)?t("a_hello"):t("a_none");
}
const cm=$("#cm"),say=(m,me)=>{const d=document.createElement("div");d.className="m"+(me?" me":"");d.textContent=m;cm.append(d);cm.scrollTop=1e9};
