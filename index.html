<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moul L'Hwayj · Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Outfit:wght@400;600&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f6f4ef;--card:#fff;--gold:#c98a12;--line:#d9d6cc;--ok:#1b7a3d;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Outfit,Cairo,sans-serif;background:var(--paper);color:var(--ink)}
h1,h2,h3{font-family:'Playfair Display',Cairo,serif;margin:0}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
header h1{font-size:20px;flex:1}
button,select,input{font:inherit}
.btn{background:var(--gold);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;border:1px solid currentColor;color:inherit}
.btn.red{background:var(--bad)}
.flags button{background:none;border:0;font-size:22px;cursor:pointer;opacity:.5}
.flags button.on{opacity:1}
.hero{padding:34px 16px 18px;max-width:900px;margin:auto}
.hero h2{font-size:clamp(28px,6vw,46px)}
.hero p{max-width:60ch;line-height:1.5}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;max-width:900px;margin:auto}
.cats button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;cursor:pointer}
.cats button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;max-width:900px;margin:auto;padding:8px 16px 90px}
.p{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.p img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#e8e5dc}
.p div{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.p b{font-size:15px}.p small{color:#667}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:#667}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:10;padding:16px}
.modal.on{display:flex}
.box{background:var(--paper);border-radius:16px;padding:18px;width:100%;max-width:520px}
.box .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.box input,.box select,.box textarea{width:100%;padding:12px;margin:5px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}
.desc{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.desc.open{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats div{background:#fff;border-radius:10px;padding:10px}.stats b{font-size:22px;display:block}
#msg{margin:8px 0;font-weight:600;min-height:20px}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row span{flex:1}.row button{padding:6px 10px}
#prev{max-width:110px;border-radius:10px;display:none}
.float{position:fixed;right:12px;bottom:14px;display:flex;flex-direction:column;gap:10px;z-index:6}
.float a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:24px;box-shadow:0 3px 10px #0004}
.sec{max-width:900px;margin:auto;padding:10px 16px 20px}
.sec h2{font-size:26px;margin-bottom:10px}
.sec input,.sec textarea,.sec select{width:100%;padding:12px;margin:4px 0;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;display:block;color:inherit;text-decoration:none}
.old{text-decoration:line-through;color:#889;font-weight:400;margin-left:6px}
.tag{background:var(--bad);color:#fff;border-radius:6px;padding:2px 6px;font-size:12px;align-self:flex-start}
.float a,.float button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;color:#fff;padding:0}
.float svg{width:28px;height:28px}
.wa{animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #25d36699}70%{box-shadow:0 0 0 14px #25d36600}100%{box-shadow:0 0 0 0 #25d36600}}
@media (prefers-reduced-motion:reduce){.wa{animation:none}}
#chat{position:fixed;right:12px;bottom:14px;width:min(360px,calc(100% - 24px));max-height:75vh;background:#fff;border-radius:16px;box-shadow:0 8px 30px #0006;display:none;flex-direction:column;z-index:12;overflow:hidden}
#chat.on{display:flex}
.ch{background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.m{max-width:85%;padding:8px 12px;border-radius:12px;line-height:1.4;white-space:pre-wrap}
.m.b{background:#eceae2;align-self:flex-start}
.m.u{background:var(--ink);color:#fff;align-self:flex-end}
.qs{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}
.qs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;cursor:pointer;font-size:13px}
.qs button.go{background:#25D366;color:#fff;border-color:#25D366}
#chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#chat input{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px}
.soc a{display:inline-block;margin:0 6px}
.soc svg{width:36px;height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.sw{display:inline-block;width:36px;height:36px;border-radius:50%;outline:1px solid #0005;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold)}
.sw.s{width:24px;height:24px}
.sz{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-style:normal;min-width:40px;text-align:center}
.sz.on{background:var(--ink);color:#fff}
.sz.s{padding:4px 8px;font-size:13px;min-width:0}
.box h3{margin:16px 0 6px}
.box pre{white-space:pre-wrap;margin:4px 0;font:inherit;font-size:14px}
footer{background:var(--ink);color:#fff;padding:20px 16px 90px;text-align:center;line-height:1.8}
footer a{color:#fff;margin:0 8px}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ====== 1) PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBbt6iGbDnnaK_1RUzJc1vEbg5_kDlJ-Uc",
  authDomain: "moulelhawayajboutique-e5b41.firebaseapp.com",
  databaseURL: "https://moulelhawayajboutique-e5b41-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "moulelhawayajboutique-e5b41",
  storageBucket: "moulelhawayajboutique-e5b41.firebasestorage.app",
  messagingSenderId: "48931488589",
  appId: "1:48931488589:web:6804ff7d5eddfc0166ad04"
};
const ADMIN_UID = "9qwxQhmsNlaWQ0opqzvW2NCDjob2";
const PHONE = "212666662509";
const CATS = ["camisas","pantalones","chaquetas","zapatos","accesorios"];
/* ======================================================== */

const T = {
 es:{hero:"Moda de hombre, directa del dueño",sub:"Todas las colecciones de hombre. Pago contra reembolso y devoluciones sencillas.",all:"Todo",add:"Añadir al carrito",cart:"Carrito",total:"Total:",order:"Pedir por WhatsApp",name:"Tu nombre",city:"Ciudad y dirección",cod:"Pago contra reembolso: pagas al recibir el pedido.",empty:"Todavía no hay productos en esta categoría.",out:"Agotado",about:"Quiénes somos: boutique de moda de hombre. Ofertas y liquidaciones cada semana.",map:"📍 Cómo llegar",cats:["Camisas","Pantalones","Chaquetas","Zapatos","Accesorios"],cartEmpty:"El carrito está vacío.",fill:"Escribe tu nombre y dirección."},
 fr:{hero:"Mode homme, directement du patron",sub:"Toutes les collections homme. Paiement à la livraison et retours simples.",all:"Tout",add:"Ajouter au panier",cart:"Panier",total:"Total :",order:"Commander sur WhatsApp",name:"Votre nom",city:"Ville et adresse",cod:"Paiement à la livraison : vous payez à la réception.",empty:"Aucun produit dans cette catégorie pour le moment.",out:"Épuisé",about:"Qui sommes-nous : boutique de mode homme. Offres et liquidations chaque semaine.",map:"📍 Itinéraire",cats:["Chemises","Pantalons","Vestes","Chaussures","Accessoires"],cartEmpty:"Le panier est vide.",fill:"Indiquez votre nom et votre adresse."},
 en:{hero:"Menswear, straight from the owner",sub:"All men's collections. Cash on delivery and easy returns.",all:"All",add:"Add to cart",cart:"Cart",total:"Total:",order:"Order on WhatsApp",name:"Your name",city:"City and address",cod:"Cash on delivery: you pay when it arrives.",empty:"No products in this category yet.",out:"Sold out",about:"About us: a menswear boutique. New offers and clearance every week.",map:"📍 Directions",cats:["Shirts","Trousers","Jackets","Shoes","Accessories"],cartEmpty:"Your cart is empty.",fill:"Enter your name and address."},
 it:{hero:"Moda uomo, direttamente dal titolare",sub:"Tutte le collezioni uomo. Pagamento alla consegna e resi semplici.",all:"Tutto",add:"Aggiungi al carrello",cart:"Carrello",total:"Totale:",order:"Ordina su WhatsApp",name:"Il tuo nome",city:"Città e indirizzo",cod:"Pagamento alla consegna: paghi quando ricevi l'ordine.",empty:"Nessun prodotto in questa categoria.",out:"Esaurito",about:"Chi siamo: boutique di moda uomo. Offerte e saldi ogni settimana.",map:"📍 Indicazioni",cats:["Camicie","Pantaloni","Giacche","Scarpe","Accessori"],cartEmpty:"Il carrello è vuoto.",fill:"Inserisci nome e indirizzo."}
};
const FLAGS = {ar:"🇲🇦",es:"🇪🇸",fr:"🇫🇷",en:"🇬🇧",it:"🇮🇹"};
let lang = localStorage.getItem("lang") || "ar", cat = "all", products = {}, cart = {}, editId = null, photo = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = k => T[lang][k];

let db, auth;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database(); auth = firebase.auth();
  db.ref("products").on("value", s => { products = s.val() || {}; render(); }, e => { products = {}; render(); setMsg("Lectura bloqueada: " + e.message, true); });
} catch (e) { console.error(e); }

function setMsg(m, bad) { const el = $("msg"); el.textContent = m; el.style.color = bad ? "var(--bad)" : "var(--ok)"; }
function closeM(id) { $(id).classList.remove("on"); }

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("flags").innerHTML = Object.keys(FLAGS).map(l => `<button class="${l===lang?"on":""}" onclick="setLang('${l}')" aria-label="${l}">${FLAGS[l]}</button>`).join("");
  $("tHero").textContent = t("hero"); $("tSub").textContent = t("sub"); $("tAbout").textContent = t("about");
  $("tMap").textContent = t("map"); $("tCart").textContent = t("cart"); $("tTotal").textContent = t("total");
  $("tOrder").textContent = t("order"); $("tCod").textContent = t("cod");
  $("cName").placeholder = t("name"); $("cCity").placeholder = t("city");
  const cur = $("fCat").value;
  $("fCat").innerHTML = allCats().map(c => `<option value="${c.key}">${esc(c.label)}</option>`).join("");
  if (cur) $("fCat").value = cur;
  $("cats").innerHTML = `<button class="${cat==="all"?"on":""}" onclick="setCat('all')">${t("all")}</button>` +
    allCats().map(c => `<button class="${cat===c.key?"on":""}" onclick="setCat('${c.key}')">${esc(c.label)}</button>`).join("");
}
function setLang(l) { lang = l; localStorage.setItem("lang", l); applyLang(); render(); renderCart(); }
function setCat(c) { cat = c; applyLang(); render(); }

function render() {
  const list = Object.entries(products).filter(([, p]) => cat === "all" || p.cat === cat);
  $("grid").innerHTML = list.length ? list.map(([id, p]) => `
    <article class="p">${p.img ? `<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">` : `<img alt="">`}
      <div><b>${esc(p.name)}</b><small>${esc(catLabel(p.cat))}</small>${p.desc ? `<small class="desc" onclick="this.classList.toggle('open')">${esc(p.desc)}</small>` : ""}
      ${p.old > p.price ? `<span class="tag">-${Math.round(100 - p.price / p.old * 100)}%</span>` : ""}<b>${Number(p.price)} DH${p.old > p.price ? `<span class="old">${Number(p.old)}</span>` : ""}</b>${chipsFor(id, p)}
      ${p.stock > 0 ? `<button class="btn" onclick="addCart('${id}')">${t("add")}</button>` : `<small>${t("out")}</small>`}</div></article>`).join("")
    : `<div class="empty">${t("empty")}</div>`;
  renderAdminList();
}

/* ---- Carrito ---- */
function addCart(id) {
  const p = products[id], s = sel[id] || {};
  if (colorsOf(p).length && !s.c) return alert(PK[lang][0]);
  if (sizesOf(p).length && !s.s) return alert(PK[lang][1]);
  const k = [id, s.c || "", s.s || ""].join("|");
  cart[k] = Math.min((cart[k] || 0) + 1, p.stock); renderCart(); openCart();
}
function openCart() { renderCart(); $("mCart").classList.add("on"); }
function renderCart() {
  const ks = Object.keys(cart).filter(k => products[k.split("|")[0]]);
  let total = 0, n = 0;
  $("cartList").innerHTML = ks.length ? ks.map(k => {
    const [id, c, z] = k.split("|"), p = products[id], q = cart[k]; total += p.price * q; n += q;
    return `<div class="row"><span>${esc(p.name)} ${esc([c, z].filter(Boolean).join(" · "))} × ${q}</span><b>${p.price * q} DH</b><button class="btn alt" onclick="chg('${k}',-1)">−</button><button class="btn alt" onclick="chg('${k}',1)">+</button></div>`;
  }).join("") : `<p>${t("cartEmpty")}</p>`;
  $("cartTotal").textContent = total; $("cn").textContent = n;
}
function chg(k, d) {
  cart[k] = (cart[k] || 0) + d;
  if (cart[k] <= 0) delete cart[k]; else { const p = products[k.split("|")[0]]; if (cart[k] > p.stock) cart[k] = p.stock; }
  renderCart();
}
function checkout() {
  const ids = Object.keys(cart).filter(k => products[k.split("|")[0]]);
  if (!ids.length) return alert(t("cartEmpty"));
  if (!$("cName").value.trim() || !$("cCity").value.trim()) return alert(t("fill"));
  const lines = ids.map(k => { const [id, c, z] = k.split("|"), p = products[id]; return `• ${p.name} ${[c, z].filter(Boolean).join(" · ")} × ${cart[k]} = ${p.price * cart[k]} DH`; }).join("\n");
  const msg = `${t("cart")}:\n${lines}\n${t("total")} ${$("cartTotal").textContent} DH\n${$("cName").value}\n${$("cCity").value}`;
  if (db) db.ref("orders").push({ name: $("cName").value.trim(), city: $("cCity").value.trim(), items: lines, total: Number($("cartTotal").textContent), ts: Date.now() }).catch(() => {});
  window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`, "_blank");
}

/* ---- Admin ---- */
function openAdmin() { $("mAdmin").classList.add("on"); checkAuth(auth && auth.currentUser); }
function checkAuth(u) {
  const ok = u && u.uid === ADMIN_UID;
  $("login").style.display = ok ? "none" : "block"; $("panel").style.display = ok ? "block" : "none";
  if (u && !ok) alert("Este usuario no es el administrador.");
  renderAdminList();
}
if (auth) auth.onAuthStateChanged(checkAuth);
function login() {
  auth.signInWithEmailAndPassword($("aMail").value.trim(), $("aPass").value)
    .catch(e => alert("No se pudo entrar: " + e.message));
}
function logout() { auth.signOut(); }

$("fFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 800 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

function shrink(f, cb) {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 800 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL("image/jpeg", 0.7));
  };
  img.onerror = () => setMsg("No se pudo leer la foto.", true);
  img.src = URL.createObjectURL(f);
}

  $("qs").innerHTML = c.qs.map(q => `<button onclick="quick(this.textContent)">${esc(q)}</button>`).join("");
}
const _al2 = applyLang;
applyLang = function () { _al2(); chatUI(); };
function say(cls, text) {
  const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text;
  $("msgs").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight;
}
function toggleChat() {

  if (chatOpen && !$("msgs").children.length) say("b", CH[lang].hi);
  if (chatOpen) $("qIn").focus();
}
function quick(q) { $("qIn").value = q; ask(); }
function ask(e) {
  if (e) e.preventDefault();
  const q = $("qIn").value.trim(); if (!q) return false;
  $("qIn").value = ""; asked.push(q); say("u", q); say("b", reply(q)); return false;
}
function reply(q) {
  const c = CH[lang], list = Object.values(products);
  let s = q.toLowerCase();
  [[/عرض|عروض|تخفيض|خصم/, "ofert"], [/إرجاع|ارجاع|استرجاع|تبديل/, "devol"], [/دفع/, "pago"], [/توصيل|شحن/, "envio"], [/أين|اين|موقع|عنوان|خريطة/, "donde"], [/هاتف|اتصال|رقم|واتساب|تواصل/, "telefono"], [/مجموعة|مجموعات|تشكيل|فئات/, "colec"]]
    .forEach(([r, k]) => { if (r.test(s)) s += " " + k; });
  if (/ofert|descuent|liquid|rebaj|promo|sale|discount|soldes|sconto|saldi|offre/.test(s)) {
    const o = list.filter(p => p.old > p.price);
    return o.length ? c.off + "\n" + o.map(p => `• ${p.name}: ${p.price} DH (${p.old} DH)`).join("\n") : c.noOff;
  }
  if (/devol|retour|return|resi\b|cambi|échang|exchange/.test(s)) return c.ret;
  if (/pag|reembols|paie|pay|cash|contrass|contanti/.test(s)) return c.pay;
  if (/env[ií]o|entreg|livraison|deliver|ship|spedi|consegn/.test(s)) return c.ship;
  if (/d[oó]nde|ubic|direcci|gps|mapa|où|adresse|where|location|address|dove|indirizzo/.test(s)) return c.loc;
  if (/tel[eé]f|llam|whats|phone|call|num[eé]ro|contact|telefono/.test(s)) return c.ctc;
  const words = s.split(/[^a-zà-ÿ0-9\u0600-\u06FF]+/).filter(w => w.length >= 3);
  const hit = list.filter(p => words.some(w => p.name.toLowerCase().includes(w))).slice(0, 4);
  if (hit.length) return hit.map(p => `• ${p.name}: ${p.price} DH · ${p.stock > 0 ? p.stock + " " + c.stock : c.out}`).join("\n");
  if (/colec|categor|cat[aá]log|collection|catégor|qu[eé] ten|what do you|cosa avete/.test(s)) return c.cats + " " + allCats().map(x => x.label).join(", ");
  return c.fb;
}
function toWa() {
  const c = CH[lang], txt = asked.length ? c.wm + "\n" + asked.map(q => "- " + q).join("\n") : c.wm;
  window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(txt)}`, "_blank");
}
